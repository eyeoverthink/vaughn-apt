<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photorealistic 3D Gaussian Splat Viewer — Apartment Scan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e16; color: #f0f6fc; font-family: 'Segoe UI', system-ui, sans-serif; }
    #splat-root { width: 100vw; height: 100vh; }
    .topbar {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 20;
      display: flex; justify-content: space-between; align-items: center; pointer-events: none;
    }
    .panel {
      pointer-events: auto; background: rgba(12, 17, 27, 0.84); backdrop-filter: blur(8px);
      border: 1px solid rgba(88, 213, 255, 0.3); border-radius: 12px; padding: 10px 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .title { font-size: 14px; font-weight: 700; color: #58d5ff; }
    .sub { font-size: 12px; color: #a9b8cc; }
    a.btn {
      text-decoration: none; background: linear-gradient(135deg, #2596ff, #00c4a7);
      color: #06121b; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 13px;
    }
    #status {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
      background: rgba(12, 17, 27, 0.88); border: 1px solid rgba(255,255,255,0.16);
      padding: 9px 16px; border-radius: 999px; font-size: 13px; color: #7ee787;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
      }
    }
  </script>
</head>
<body>
  <div class="topbar">
    <div class="panel">
      <div>
        <div class="title">PHOTOREALISTIC 3D GAUSSIAN SPLAT (BRUSH / RTX 5070)</div>
        <div class="sub">Drag to orbit · Right-drag to pan · Scroll to zoom · W/A/S/D to fly</div>
      </div>
    </div>
    <div class="panel">
      <a class="btn" href="index.html">← Back to Blender Escape Room</a>
    </div>
  </div>
  <div id="status">Loading trained 3D Gaussian Splat (apartment_splat.ply)...</div>
  <div id="splat-root"></div>

  <script type="module">
    import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

    const status = document.getElementById('status');
    const viewer = new GaussianSplats3D.Viewer({
      rootElement: document.getElementById('splat-root'),
      cameraUp: [0, -1, 0],
      initialCameraPosition: [0, -0.5, -2.5],
      initialCameraLookAt: [0, 0, 1.5],
      sharedMemoryForWorkers: false,
      selfDrivenMode: true,
    });

    viewer.addSplatScene('../scan/splat/apartment_splat.ply', {
      splatAlphaRemovalThreshold: 5,
      showLoadingUI: true,
    })
      .then(() => {
        viewer.start();
        status.textContent = '3D Gaussian Splat Ready! Drag to orbit · Scroll to zoom · WASD to move';
        setTimeout(() => { status.style.opacity = '0.75'; }, 4000);
      })
      .catch((err) => {
        console.error(err);
        status.style.color = '#ff7b72';
        status.textContent = 'Could not load PLY in WebGL — try launch_brush_splat.bat for native RTX 5070 viewer!';
      });
  </script>
</body>
</html>
